<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VR 체험존 순번 대기 전광판 및 리모컨</title>
  <style>
    :root {
      --bg: #0f172a; 
      --card: #1e293b;
      --primary: #06b6d4; 
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      padding: 20px;
      text-align: center;
      border-bottom: 4px solid var(--primary);
    }
    .header h1 { font-size: 38px; font-weight: 900; color: var(--primary); letter-spacing: 2px; }

    .display-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      padding: 30px;
      gap: 30px;
    }

    .main-call-box {
      flex: 2;
      background: var(--card);
      border-radius: 24px;
      border: 2px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      padding: 40px 20px;
    }
    .main-call-box .title { font-size: 40px; font-weight: 800; color: var(--muted); margin-bottom: 10px; }
    .main-call-box .number { font-size: 180px; font-weight: 900; color: #fff; text-shadow: 0 0 30px rgba(6,182,212,0.6); line-height: 1; margin: 20px 0; }
    .main-call-box .status-text { font-size: 28px; font-weight: bold; color: var(--accent); background: rgba(16,185,129,0.1); padding: 10px 30px; border-radius: 50px; text-align: center; }

    .side-status-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .status-card {
      flex: 1;
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px solid #334155;
    }
    .status-card h3 { font-size: 24px; color: var(--muted); margin-bottom: 15px; text-align: center; }
    .status-card .val { font-size: 70px; font-weight: 900; color: var(--primary); }

    .remote-panel {
      background: #1e293b;
      border-top: 4px solid #475569;
      padding: 20px;
    }
    .remote-title { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .btn-toggle-remote { background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; padding: 5px; }
    
    .remote-controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
    }
    .btn-remote {
      border: 0; border-radius: 14px; padding: 18px; font-size: 20px; font-weight: 800; cursor: pointer; color: #fff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.1s;
    }
    .btn-remote:active { transform: scale(0.97); }
    .btn-remote.next { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .btn-remote.prev { background: #475569; }
    .btn-remote.recall { background: #10b981; }

    @media (max-width: 900px) {
      body { overflow-y: auto; }
      .display-container { flex-direction: column; padding: 15px; gap: 15px; }
      .main-call-box .number { font-size: 120px; }
      .remote-controls { grid-template-columns: 1fr; }
      .main-call-box .title { font-size: 28px; }
      .main-call-box .status-text { font-size: 20px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>VR 체험존 실시간 입장 순서 안내</h1>
  </header>

  <div class="display-container">
    <div class="main-call-box">
      <div class="title">지 금 입 장 하 실 번 호</div>
      <div class="number" id="tvCalledNo">000</div>
      <div class="status-text" id="tvStatusMsg">🔔 지정 스피커 볼륨을 높여주세요</div>
    </div>

    <div class="side-status-box">
      <div class="status-card">
        <h3>VR 금일 예약 건수</h3>
        <div class="val" id="tvLastNo">000</div>
      </div>
      <div class="status-card">
        <h3>현재 대기 중인 인원</h3>
        <div class="val" id="tvWaitCount" style="color: #f59e0b;">0 명</div>
      </div>
    </div>
  </div>

  <div class="remote-panel" id="remoteControllerBox">
    <div class="remote-title">
      <span>🕹️ 직원 전용 스마트 무선 리모컨 컨트롤러</span>
      <button class="btn-toggle-remote" onclick="toggleTvMode()">🖥️ TV 모드 전환 (컨트롤러 숨기기/열기)</button>
    </div>
    <div class="remote-controls">
      <button class="btn-remote next" onclick="callNextNumber()">▶ 다음 고객 호출 (번호 +1 및 딩동음)</button>
      <button class="btn-remote recall" onclick="reVoiceSignal()">🔄 재호출 (음성 재송출)</button>
      <button class="btn-remote prev" onclick="callPrevNumber()">◀ 이전 번호로 후퇴</button>
    </div>
  </div>

  <script>
    // 주임님의 Firebase 주소 연동
    const FIREBASE_URL = "https://mungyeong-kiosk-default-r
