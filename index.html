<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>문경에코월드 통합 대기 전광판</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --survival-color: #a855f7; /* 서바이벌 보라색 테마 */
      --vr-color: #06b6d4;       /* VR 하늘색 테마 */
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      padding: 12px;
      text-align: center;
      border-bottom: 3px solid #334155;
    }
    .header h1 { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: 1px; }

    /* 좌우 2분할 메인 컨테이너 */
    .split-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      padding: 15px;
      gap: 15px;
      overflow: hidden;
    }

    /* 구역 공통 스타일 */
    .section-zone {
      flex: 1;
      background: var(--card);
      border-radius: 20px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .zone-title {
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      color: #fff;
    }
    .section-zone.survival { border: 3px solid var(--survival-color); }
    .section-zone.survival .zone-title { background: var(--survival-color); }
    .section-zone.vr { border: 3px solid var(--vr-color); }
    .section-zone.vr .zone-title { background: var(--vr-color); }

    /* 대형 호출 번호 박스 */
    .number-box {
      flex: 1.5;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .number-box .label { font-size: 16px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
    .number-box .num { font-size: 75px; font-weight: 900; line-height: 1.1; }
    .section-zone.survival .num { color: #fff; text-shadow: 0 0 20px rgba(168,85,247,0.6); }
    .section-zone.vr .num { color: #fff; text-shadow: 0 0 20px rgba(6,182,212,0.6); }

    /* 현황판 요약 (예약/대기) */
    .status-row {
      display: flex;
      gap: 10px;
    }
    .mini-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .mini-card p { font-size: 12px; color: var(--muted); font-weight: bold; margin-bottom: 4px; }
    .mini-card div { font-size: 24px; font-weight: 900; }

    /* 직원용 제어 리모컨 버튼 영역 */
    .control-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }
    .btn {
      border: 0; border-radius: 10px; padding: 12px 5px; font-size: 14px; font-weight: 800; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center; transition: background 0.1s;
    }
    .btn:active { opacity: 0.8; }
    .survival .btn.next { background: var(--survival-color); }
    .vr .btn.next { background: var(--vr-color); }
    .btn.sub { background: #475569; font-size: 12px; }

    /* 모바일 세로 모드 대응 (위아래 정렬로 자동 변경) */
    @media (max-width: 768px) {
      .split-container { flex-direction: column; padding: 10px; gap: 10px; }
      .header h1 { font-size: 20px; }
      .zone-title { font-size: 16px; padding: 6px; }
      .number-box .num { font-size: 50px; }
      .mini-card div { font-size: 20px; }
      .btn { padding: 10px 5px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>문경에코월드 실시간 입장 안내 시스템</h1>
  </header>

  <div class="split-container">
    
    <div class="section-zone survival">
      <div class="zone-title">💥 레이저 서바이벌</div>
      <div class="number-box">
        <div class="label">지금 입장하실 번호</div>
        <div class="num" id="svCalledNo">000</div>
      </div>
      <div class="status-row">
        <div class="mini-card">
          <p>금일 예약</p>
          <div id="svLastNo" style="color: var(--survival-color);">000</div>
        </div>
        <div class="mini-card">
          <p>현재 대기</p>
          <div id="svWaitCount" style="color: #f59e0b;">0명</div>
        </div>
      </div>
      <div class="control-row">
        <button class="btn next" onclick="callNext('survival')">▶ 호출 (+1)</button>
        <button class="btn sub" onclick="callPrev('survival')">◀ 후퇴</button>
      </div>
    </div>

    <div class="section-zone vr">
      <div class="zone-title">🽳 VR 체험존</div>
      <div class="number-box">
        <div class="label">지금 입장하실 번호</div>
        <div class="num" id="vrCalledNo">000</div>
      </div>
      <div class="status-row">
        <div class="mini-card">
          <p>금일 예약</p>
          <div id="vrLastNo" style="color: var(--vr-color);">000</div>
        </div>
        <div class="mini-card">
          <p>현재 대기</p>
          <div id="vrWaitCount" style="color: #f59e0b;">0명</div>
        </div>
      </div>
      <div class="control-row">
        <button class="btn next" onclick="callNext('vr')">▶ 호출 (+1)</button>
        <button class="btn sub" onclick="callPrev('vr')">◀ 후퇴</button>
      </div>
    </div>

  </div>

  <script>
    // 키오스크 키값 동기화 설정
    const KEYS = {
      survival: { last: 'eco_survival_last', called: 'eco_survival_called', name: '레이저 서바이벌' },
      vr: { last: 'eco_vr_last', called: 'eco_vr_called', name: '브이알 체험' }
    };

    let data = {
      survival: { last: 0, called: 0 },
      vr: { last: 0, called: 0 }
    };

    const $ = id => document.getElementById(id);
    function pad(n){ return String(n).padStart(3, '0'); }

    window.onload = function() {
      syncAll(false);
      window.addEventListener('storage', (e) => {
        if(Object.values(KEYS).some(k => k.last === e.key || k.called === e.key)) {
          syncAll(true);
        }
      });
      setInterval(() => syncAll(false), 800); // 0.8초 간격 상시 체크 연동
    };

    function syncAll(triggerVoice = false) {
      ['survival', 'vr'].forEach(type => {
        const k = KEYS[type];
        const curLast = Number(localStorage.getItem(k.last) || 0);
        const curCalled = Number(localStorage.getItem(k.called) || 0);

        if (curCalled !== data[type].called && data[type].called !== 0 && triggerVoice) {
          data[type].called = curCalled;
          data[type].last = curLast;
          updateDom(type);
          playVoice(type, curCalled);
        } else {
          data[type].last = curLast;
          data[type].called = curCalled;
          updateDom(type);
        }
      });
    }

    function updateDom(type) {
      const prefix = (type === 'survival') ? 'sv' : 'vr';
      $(prefix + 'LastNo').textContent = pad(data[type].last);
      $(prefix + 'CalledNo').textContent = pad(data[type].called);
      
      let wait = data[type].last - data[type].called;
      if (wait < 0) wait = 0;
      $(prefix + 'WaitCount').textContent = wait + "명";
    }

    function playVoice(type, num) {
      if (num === 0) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext
