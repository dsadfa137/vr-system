<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>문경에코월드 실시간 입장 안내 전광판</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #1e293b;
      --survival-color: #a855f7;
      --vr-color: #06b6d4;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 20px;
    }

    /* 상단 헤더 (전광판 스타일) */
    .header {
      text-align: center;
      padding: 15px 0 25px 0;
      position: relative;
    }
    .header h1 {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }
    .header .subtitle {
      font-size: 18px;
      color: var(--muted);
      margin-top: 5px;
      font-weight: 500;
    }

    /* 대형 2분할 레이아웃 */
    .split-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 25px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .section-zone {
      flex: 1;
      background: var(--card);
      border-radius: 32px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
    }

    /* 각 구역 테두리 부각 */
    .section-zone.survival { border: 4px solid var(--survival-color); }
    .section-zone.vr { border: 4px solid var(--vr-color); }

    /* 구역 타이틀 (크고 선명하게) */
    .zone-title {
      font-size: 36px;
      font-weight: 900;
      text-align: center;
      padding: 18px;
      border-radius: 20px;
      color: #fff;
      letter-spacing: 1px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .section-zone.survival .zone-title { background: linear-gradient(135deg, var(--survival-color), #7c3aed); }
    .section-zone.vr .zone-title { background: linear-gradient(135deg, var(--vr-color), #0891b2); }

    /* 전광판 핵심: 대형 번호 박스 */
    .number-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid #334155;
    }
    .number-box .label { 
      font-size: 24px; 
      font-weight: 700; 
      color: var(--muted); 
      margin-bottom: 15px; 
      letter-spacing: 1px;
    }
    .number-box .num { 
      font-size: 180px; 
      font-weight: 900; 
      line-height: 1; 
      font-family: 'Courier New', Courier, monospace; /* 숫자 정렬용 고정폭 느낌 */
    }
    
    /* 호출된 번호 LED 글로우 효과 */
    .section-zone.survival .num { color: #ffffff; text-shadow: 0 0 40px rgba(168,85,247,0.8); }
    .section-zone.vr .num { color: #ffffff; text-shadow: 0 0 40px rgba(6,182,212,0.8); }

    /* 하단 상태바 (접수 현황 안내) */
    .status-row { 
      display: flex; 
      background: rgba(15, 23, 42, 0.4);
      border-radius: 16px;
      padding: 15px;
      justify-content: center;
      align-items: center;
      border: 1px solid #334155;
    }
    .status-row p { font-size: 18px; color: var(--muted); font-weight: bold; margin-right: 15px; }
    .status-row div { font-size: 24px; font-weight: 900; }

    /* 오디오 활성화 유도 안내 레이어 (브라우저 정책 대응) */
    #audioNotice {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.95);
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 16px;
      z-index: 1000;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 대형 모니터 및 TV 대응 미디어 쿼리 */
    @media (min-width: 1920px) {
      .header h1 { font-size: 54px; }
      .zone-title { font-size: 46px; }
      .number-box .num { font-size: 24px; font-size: 240px; }
      .number-box .label { font-size: 28px; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div id="audioNotice" onclick="enableAudio()">
    🔊 알림음 및 음성 재생을 위해 화면을 아무 곳이나 한 번 클릭해 주세요!
  </div>

  <header class="header">
    <h1>문경에코월드 실시간 입장 안내</h1>
    <div class="subtitle">해당 번호의 대기자분께서는 입장해 주시기 바랍니다.</div>
  </header>

  <div class="split-container">
    <div class="section-zone survival">
      <div class="zone-title">💥 레이저 서바이벌</div>
      <div class="number-box">
        <div class="label">현재 입장 번호</div>
        <div class="num" id="svCalledNo">000</div>
      </div>
      <div class="status-row">
        <p>오늘 총 접수 건수 :</p>
        <div id="svLastNo" style="color: var(--survival-color);">000</div>
      </div>
    </div>

    <div class="section-zone vr">
      <div class="zone-title">🤖 VR 체험존</div>
      <div class="number-box">
        <div class="label">현재 입장 번호</div>
        <div class="num" id="vrCalledNo">000</div>
      </div>
      <div class="status-row">
        <p>오늘 총 접수 건수 :</p>
        <div id="vrLastNo" style="color: var(--vr-color);">000</div>
      </div>
    </div>
  </div>

  <script>
    // 키오스크 소스코드와 동일한 파이어베이스 설정 적용
    const firebaseConfig = {
      apiKey: "AIzaSyDeKWmVbxfvO9SKjJXYCkuJrz630u6pxsk",
      authDomain: "mungyeong-kiosk.firebaseapp.com",
      databaseURL: "https://mungyeong-kiosk-default-rtdb.firebaseio.com/",
      projectId: "mungyeong-kiosk",
      storageBucket: "mungyeong-kiosk.appspot.com",
      messagingSenderId: "1020366726033",
      appId: "1:1020366726033:web:04fc7e0638d1d0e40c3030",
      measurementId: "G-8GSFNWLX5Q"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 동기화할 DB 경로 매칭
    const DB_KEYS = { survival: 'eco_srv_bookings', vr: 'eco_vr_bookings' };
    const CALL_KEYS = { survival: 'eco_survival_called_display', vr: 'eco_vr_called_display' };

    let calledNumbers = { survival: 0, vr: 0 };
    let isInitialLoad = { survival: true, vr: true };
    let audioCtx = null;

    const $ = id => document.getElementById(id);
    function pad(n){ return String(n).padStart(3, '0'); }

    // 브라우저 오디오 권한 허용 함수
    function enableAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      // 알림 배너 숨기기
      const notice = $('audioNotice');
      if (notice) notice.style.display = 'none';
    }
    // 화면 전체에 클릭 이벤트 바인딩하여 자연스럽게 오디오 잠금 해제
    window.addEventListener('click', enableAudio);

    window.addEventListener('DOMContentLoaded', () => {
      // 1. 금일 총 예약 건수 실시간 수신
      database.ref(DB_KEYS.survival).on('value', (snapshot) => {
        const data = snapshot.val() || {};
        $('svLastNo').textContent = pad(Object.keys(data).length);
      });

      database.ref(DB_KEYS.vr).on('value', (snapshot) => {
        const data = snapshot.val() || {};
        $('vrLastNo').textContent = pad(Object.keys(data).length);
      });

      // 2. 레이저 서바이벌 호출 번호 모니터링 및 음성 출력
      database.ref(CALL_KEYS.survival).on('value', (snapshot) => {
        const prevNum = calledNumbers.survival;
        calledNumbers.survival = Number(snapshot.val() || 0);
        $('svCalledNo').textContent = pad(calledNumbers.survival);
        
        // 새로고침 시 기존 번호가 바로 읽히는 것을 방지 (번호가 증가했을 때만 재생)
        if (!isInitialLoad.survival && calledNumbers.survival > prevNum) {
          playVoice('survival', calledNumbers.survival);
        }
        isInitialLoad.survival = false;
      });

      // 3. VR 체험존 호출 번호 모니터링 및 음성 출력
      database.ref(CALL_KEYS.vr).on('value', (snapshot) => {
        const prevNum = calledNumbers.vr;
        calledNumbers.vr = Number(snapshot.val() || 0);
        $('vrCalledNo').textContent = pad(calledNumbers.vr);
        
        if (!isInitialLoad.vr && calledNumbers.vr > prevNum) {
          playVoice('vr', calledNumbers.vr);
        }
        isInitialLoad.vr = false;
      });
    });

    // 딩동 알림음 + TTS 음성 호명 함수
    function playVoice(type, num) {
      if (num === 0) return;
      
      // [1단계] 전자 딩동음 오디오 노드 생성 및 재생
      try {
        if (audioCtx && audioCtx.state === 'running') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); 
          gain.connect(audioCtx.destination);
          
          // 전광판에 어울리는 미음(587.33Hz) 주파수 세팅
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          osc.start(); 
          osc.stop(audioCtx.currentTime + 0.18);
        }
      } catch(e) { console.log("알림음 재생 오류:", e); }

      // [2단계] 딩동음 직후 TTS 안내 멘트 시작 (0.5초 딜레이)
      setTimeout(() => {
        const koName = (type === 'survival') ? '레이저 서바이벌' : '브이알 체험존';
        const msg = `${koName}, ${num}번 대기자님 입장해 주시기 바랍니다.`;
        
        const utterance = new SpeechSynthesisUtterance(msg);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95; // 집중도를 높이기 위해 기본보다 살짝 부드러운 속도로 설정
        window.speechSynthesis.speak(utterance);
      }, 500);
    }
  </script>
</body>
</html>
