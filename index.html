<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>문경에코월드 통합 대기 전광판</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --survival-color: #9333ea;
      --vr-color: #06b6d4;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      padding: 12px;
      text-align: center;
      border-bottom: 3px solid #334155;
      position: relative;
    }
    .header h1 { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: 1px; }

    /* [우측 상단] 직원 전용 모드 토글 스위치 버튼 */
    .admin-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: #334155;
      color: #94a3b8;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .admin-toggle.active {
      background: #ef4444;
      color: #fff;
    }

    /* 메인 2분할 레이아웃 컨테이너 */
    .split-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      padding: 15px;
      gap: 15px;
      overflow: hidden;
    }

    .section-zone {
      flex: 1;
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .zone-title {
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      color: #fff;
    }
    .section-zone.survival { border: 3px solid var(--survival-color); }
    .section-zone.survival .zone-title { background: var(--survival-color); }
    .section-zone.vr { border: 3px solid var(--vr-color); }
    .section-zone.vr .zone-title { background: var(--vr-color); }

    /* 대형 호출 번호 박스 */
    .number-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .number-box .label { font-size: 16px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    .number-box .num { font-size: 90px; font-weight: 900; line-height: 1.1; }
    .section-zone.survival .num { color: #fff; text-shadow: 0 0 20px rgba(147,51,234,0.6); }
    .section-zone.vr .num { color: #fff; text-shadow: 0 0 20px rgba(6,182,212,0.6); }

    /* 예약 현황 요약 */
    .status-row {
      display: flex;
      gap: 10px;
    }
    .mini-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .mini-card p { font-size: 13px; color: var(--muted); font-weight: bold; margin-bottom: 4px; }
    .mini-card div { font-size: 28px; font-weight: 900; }

    /* 🕹️ 직원 전용 제어 스위치 영역 (기본 숨김 처리) */
    .control-row {
      display: none; /* 토글 켜기 전까지 완전 숨김 */
      grid-template-columns: 2fr 1fr;
      gap: 10px;
      animation: fadeIn 0.2s ease-in-out;
    }
    .btn {
      border: 0; border-radius: 12px; padding: 14px 5px; font-size: 15px; font-weight: 800; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center; transition: opacity 0.1s;
    }
    .btn:active { opacity: 0.8; }
    .survival .btn.next { background: var(--survival-color); }
    .vr .btn.next { background: var(--vr-color); }
    .btn.sub { background: #475569; font-size: 13px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 📱 모바일 세로 모드 대응 */
    @media (max-width: 768px) {
      body { overflow-y: auto; }
      .split-container { 
        flex-direction: column; 
        padding: 10px; 
        gap: 10px; 
        overflow-y: visible;
        flex: none;
        height: auto;
      }
      .header h1 { font-size: 18px; }
      .admin-toggle { padding: 4px 8px; font-size: 11px; }
      .section-zone { padding: 15px; gap: 8px; flex: none; }
      .zone-title { font-size: 16px; padding: 6px; }
      .number-box { padding: 15px 10px; }
      .number-box .num { font-size: 60px; }
      .mini-card div { font-size: 22px; }
      .btn { padding: 16px 5px; font-size: 14px; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <header class="header">
    <h1>문경에코월드 실시간 입장 안내 시스템</h1>
    <button class="admin-toggle" id="adminToggle" onclick="toggleAdminMode()">⚙️ 직원 제어 열기</button>
  </header>

  <div class="split-container">
    
    <div class="section-zone survival">
      <div class="zone-title">💥 레이저 서바이벌</div>
      <div class="number-box">
        <div class="label">현재 호출 대기 번호</div>
        <div class="num" id="svCalledNo">000</div>
      </div>
      <div class="status-row">
        <div class="mini-card">
          <p>금일 총 예약 건수</p>
          <div id="svLastNo" style="color: var(--survival-color);">000</div>
        </div>
      </div>
      <div class="control-row admin-controls">
        <button class="btn next" onclick="callNext('survival')">▶ 다음 번호 호출 (+1)</button>
        <button class="btn sub" onclick="callPrev('survival')">◀ 후퇴</button>
      </div>
    </div>

    <div class="section-zone vr">
      <div class="zone-title">🤖 VR 체험존</div>
      <div class="number-box">
        <div class="label">현재 호출 대기 번호</div>
        <div class="num" id="vrCalledNo">000</div>
      </div>
      <div class="status-row">
        <div class="mini-card">
          <p>금일 총 예약 건수</p>
          <div id="vrLastNo" style="color: var(--vr-color);">000</div>
        </div>
      </div>
      <div class="control-row admin-controls">
        <button class="btn next" onclick="callNext('vr')">▶ 다음 번호 호출 (+1)</button>
        <button class="btn sub" onclick="callPrev('vr')">◀ 후퇴</button>
      </div>
    </div>

  </div>

  <script>
    // 🔑 주임님의 Firebase 프로젝트 설정 정보 연동
    const firebaseConfig = {
      apiKey: "AIzaSyDeKWMVbxfvO9SKjJXYCkuJrz630u6pxsk",
      authDomain: "mungyeong-kiosk.firebaseapp.com",
      databaseURL: "https://mungyeong-kiosk-default-rtdb.firebaseio.com",
      projectId: "mungyeong-kiosk",
      storageBucket: "mungyeong-kiosk.appspot.com",
      messagingSenderId: "1020366726033",
      appId: "1:1020366726033:web:04fc7e0638d1d0e40c3030",
      measurementId: "G-8GSFNWLX5Q"
    };

    // Firebase 초기화 및 실시간 데이터베이스 연결
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const DB_KEYS = { survival: 'eco_srv_bookings', vr: 'eco_vr_bookings' };
    const CALL_KEYS = { survival: 'eco_survival_called_display', vr: 'eco_vr_called_display' };

    let totalCounts = { survival: 0, vr: 0 };
    let calledNumbers = { survival: 0, vr: 0 };

    const $ = id => document.getElementById(id);
    function pad(n){ return String(n).padStart(3, '0'); }

    // 직원 전용 스위치 제어 기능 (토글)
    function toggleAdminMode() {
      const btn = $('adminToggle');
      const controls = document.querySelectorAll('.admin-controls');
      const isHidden = controls[0].style.display !== 'grid';

      controls.forEach(el => {
        el.style.display = isHidden ? 'grid' : 'none';
      });

      if(isHidden) {
        btn.textContent = '🔒 제어 스위치 숨기기';
        btn.classList.add('active');
      } else {
        btn.textContent = '⚙️ 직원 제어 열기';
        btn.classList.remove('active');
      }
    }

    // 🚀 화면 로드 시 파이어베이스 실시간 데이터 연동 시작
    window.onload = function() {
      // 1. 레이저 서바이벌 예약 데이터 실시간 감시
      database.ref(DB_KEYS.survival).on('value', (snapshot) => {
        const data = snapshot.val() || {};
        totalCounts.survival = Object.keys(data).length;
        $('svLastNo').textContent = pad(totalCounts.survival);
      });

      // 2. VR 체험존 예약 데이터 실시간 감시
      database.ref(DB_KEYS.vr).on('value', (snapshot) => {
        const data = snapshot.val() || {};
        totalCounts.vr = Object.keys(data).length;
        $('vrLastNo').textContent = pad(totalCounts.vr);
      });

      // 3. 레이저 서바이벌 호출 번호 실시간 감시
      database.ref(CALL_KEYS.survival).on('value', (snapshot) => {
        const prevNum = calledNumbers.survival;
        calledNumbers.survival = Number(snapshot.val() || 0);
        $('svCalledNo').textContent = pad(calledNumbers.survival);
        
        // 숫자가 증가했을 때만 음성 안내 실행
        if (calledNumbers.survival > prevNum) {
          playVoice('survival', calledNumbers.survival);
        }
      });

      // 4. VR 체험존 호출 번호 실시간 감시
      database.ref(CALL_KEYS.vr).on('value', (snapshot) => {
        const prevNum = calledNumbers.vr;
        calledNumbers.vr = Number(snapshot.val() || 0);
        $('vrCalledNo').textContent = pad(calledNumbers.vr);
        
        // 숫자가 증가했을 때만 음성 안내 실행
        if (calledNumbers.vr > prevNum) {
          playVoice('vr', calledNumbers.vr);
        }
      });
    };

    // 음성 안내 및 딩동 알림음 기능
    function playVoice(type, num) {
      if (num === 0) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}

      setTimeout(() => {
        const koName = (type === 'survival') ? '레이저 서바이벌' : '브이알 체험존';
        const msg = `${koName}, ${num}번 대기자님 입장해 주시기 바랍니다.`;
        const utterance = new SpeechSynthesisUtterance(msg);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }, 500);
    }

    // 다음 번호 호출 (+1) -> Firebase 서버에 실시간 저장
    function callNext(type) {
      let curCalled = calledNumbers[type];
      let maxLimit = totalCounts[type];

      if (curCalled < maxLimit) {
        curCalled++;
        database.ref(CALL_KEYS[type]).set(curCalled);
      } else {
        const koName = (type === 'survival') ? '레이저 서바이벌' : 'VR 체험존';
        alert(`${koName}에 오늘 접수된 예약 건수가 없거나 마지막 번호입니다.`);
      }
    }

    // 후퇴 (-1) -> Firebase 서버에 실시간 저장
    function callPrev(type) {
      let curCalled = calledNumbers[type];
      if (curCalled > 0) {
        curCalled--;
        database.ref(CALL_KEYS[type]).set(curCalled);
      }
    }
  </script>
</body>
</html>
