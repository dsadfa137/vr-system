<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>문경에코월드 통합 대기 전광판</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --survival-color: #9333ea; /* 키오스크와 동일한 서바이벌 보라색 */
      --vr-color: #06b6d4;       /* 키오스크와 동일한 VR 하늘색 */
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid #334155;
    }
    .header h1 { font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 1px; }

    /* 좌우 2분할 메인 컨테이너 */
    .split-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      padding: 15px;
      gap: 15px;
      overflow: hidden;
    }

    /* 구역 공통 스타일 */
    .section-zone {
      flex: 1;
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .zone-title {
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      color: #fff;
    }
    .section-zone.survival { border: 3px solid var(--survival-color); }
    .section-zone.survival .zone-title { background: var(--survival-color); }
    .section-zone.vr { border: 3px solid var(--vr-color); }
    .section-zone.vr .zone-title { background: var(--vr-color); }

    /* 대형 호출 번호 박스 */
    .number-box {
      flex: 1.5;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .number-box .label { font-size: 18px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    .number-box .num { font-size: 85px; font-weight: 900; line-height: 1.1; }
    .section-zone.survival .num { color: #fff; text-shadow: 0 0 20px rgba(147,51,234,0.6); }
    .section-zone.vr .num { color: #fff; text-shadow: 0 0 20px rgba(6,182,212,0.6); }

    /* 현황판 요약 (예약 현황) */
    .status-row {
      display: flex;
      gap: 12px;
    }
    .mini-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .mini-card p { font-size: 14px; color: var(--muted); font-weight: bold; margin-bottom: 6px; }
    .mini-card div { font-size: 32px; font-weight: 900; }

    /* 직원용 제어 리모컨 버튼 영역 */
    .control-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }
    .btn {
      border: 0; border-radius: 12px; padding: 15px 5px; font-size: 16px; font-weight: 800; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center; transition: background 0.1s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .btn:active { opacity: 0.8; }
    .survival .btn.next { background: var(--survival-color); }
    .vr .btn.next { background: var(--vr-color); }
    .btn.sub { background: #475569; font-size: 14px; }

    /* 모바일 세로 모드 대응 (위아래 자동으로 배치 전환) */
    @media (max-width: 768px) {
      .split-container { flex-direction: column; padding: 10px; gap: 10px; }
      .header h1 { font-size: 20px; }
      .zone-title { font-size: 18px; padding: 8px; }
      .number-box .num { font-size: 55px; }
      .mini-card div { font-size: 24px; }
      .btn { padding: 12px 5px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>문경에코월드 실시간 입장 안내 시스템</h1>
  </header>

  <div class="split-container">
    
    <div class="section-zone survival">
      <div class="zone-title">💥 레이저 서바이벌</div>
      <div class="number-box">
        <div class="label">현재 호출 대기 번호</div>
        <div class="num" id="svCalledNo">000</div>
      </div>
      <div class="status-row">
        <div class="mini-card" style="flex:1;">
          <p>금일 총 예약 건수</p>
          <div id="svLastNo" style="color: var(--survival-color);">000</div>
        </div>
      </div>
      <div class="control-row">
        <button class="btn next" onclick="callNext('survival')">▶ 다음 번호 호출 (+1)</button>
        <button class="btn sub" onclick="callPrev('survival')">◀ 후퇴</button>
      </div>
    </div>

    <div class="section-zone vr">
      <div class="zone-title">🽳 VR 체험존</div>
      <div class="number-box">
        <div class="label">현재 호출 대기 번호</div>
        <div class="num" id="vrCalledNo">000</div>
      </div>
      <div class="status-row">
        <div class="mini-card" style="flex:1;">
          <p>금일 총 예약 건수</p>
          <div id="vrLastNo" style="color: var(--vr-color);">000</div>
        </div>
      </div>
      <div class="control-row">
        <button class="btn next" onclick="callNext('vr')">▶ 다음 번호 호출 (+1)</button>
        <button class="btn sub" onclick="callPrev('vr')">◀ 후퇴</button>
      </div>
    </div>

  </div>

  <script>
    // 키오스크 실제 데이터베이스 Key 명칭과 연동 매핑
    const DB_KEYS = {
      survival: 'eco_srv_bookings', // 키오스크 서바이벌 데이터 위치
      vr: 'eco_vr_bookings'         // 키오스크 VR 데이터 위치
    };

    // 직원용 호출 상태 관리 Key 명칭
    const CALL_KEYS = {
      survival: 'eco_survival_called_display',
      vr: 'eco_vr_called_display'
    };

    let totalCounts = { survival: 0, vr: 0 };
    let calledNumbers = { survival: 0, vr: 0 };

    const $ = id => document.getElementById(id);
    function pad(n){ return String(n).padStart(3, '0'); }

    window.onload = function() {
      // 초기 호출 데이터 셋팅 (없으면 0으로 생성)
      if(!localStorage.getItem(CALL_KEYS.survival)) localStorage.setItem(CALL_KEYS.survival, 0);
      if(!localStorage.getItem(CALL_KEYS.vr)) localStorage.setItem(CALL_KEYS.vr, 0);

      loadAndSyncData(false);

      // 브라우저 로컬스토리지 실시간 감지 연동 리스너
      window.addEventListener('storage', (e) => {
        if (e.key === DB_KEYS.survival || e.key === DB_KEYS.vr) {
          loadAndSyncData(false);
        }
        if (e.key === CALL_KEYS.survival) {
          calledNumbers.survival = Number(e.newValue || 0);
          $('svCalledNo').textContent = pad(calledNumbers.survival);
        }
        if (e.key === CALL_KEYS.vr) {
          calledNumbers.vr = Number(e.newValue || 0);
          $('vrCalledNo').textContent = pad(calledNumbers.vr);
        }
      });

      // 0.8초 주기 초고속 상시 리프레시 검사
      setInterval(() => loadAndSyncData(false), 800);
    };

    // 데이터 파싱 및 로드 핵심 함수
    function loadAndSyncData(triggerVoice = false) {
      // 1. 서바이벌 실시간 예약 건수 계산
      try {
        const srvRaw = localStorage.getItem(DB_KEYS.survival) || '{}';
        const srvObj = JSON.parse(srvRaw);
        totalCounts.survival = Object.keys(srvObj).length;
      } catch(e) { totalCounts.survival = 0; }

      // 2. VR 실시간 예약 건수 계산
      try {
        const vrRaw = localStorage.getItem(DB_KEYS.vr) || '{}';
        const vrObj = JSON.parse(vrRaw);
        totalCounts.vr = Object.keys(vrObj).length;
      } catch(e) { totalCounts.vr = 0; }

      // 3. 현재까지 호출된 번호 로드
      calledNumbers.survival = Number(localStorage.getItem(CALL_KEYS.survival) || 0);
      calledNumbers.vr = Number(localStorage.getItem(CALL_KEYS.vr) || 0);

      // 화면에 데이터 뿌리기
      $('svLastNo').textContent = pad(totalCounts.survival);
      $('svCalledNo').textContent = pad(calledNumbers.survival);

      $('vrLastNo').textContent = pad(totalCounts.vr);
      $('vrCalledNo').textContent = pad(calledNumbers.vr);
    }

    // 호출 음성 송출 기능 (TTS 안내방송)
    function playVoice(type, num) {
      if (num === 0) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}

      setTimeout(() => {
        const koName = (type === 'survival') ? '레이저 서바이벌' : '브이알 체험존';
        const msg = `${koName}, ${num}번 대기자님 입장해 주시기 바랍니다.`;
        const utterance = new SpeechSynthesisUtterance(msg);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }, 500);
    }

    // [다음 호출 버튼 클릭 처리]
    function callNext(type) {
      loadAndSyncData(false);
      let curCalled = calledNumbers[type];
      let maxLimit = totalCounts[type];

      if (curCalled < maxLimit) {
        curCalled++;
        localStorage.setItem(CALL_KEYS[type], curCalled);
        calledNumbers[type] = curCalled;
        $(type === 'survival' ? 'svCalledNo' : 'vrCalledNo').textContent = pad(curCalled);
        playVoice(type, curCalled);
      } else {
        const koName = (type === 'survival') ? '레이저 서바이벌' : 'VR 체험존';
        alert(`${koName}에 오늘 더 이상 접수된 예약 건수가 없거나 마지막 번호입니다.`);
      }
    }

    // [이전 번호 후퇴 버튼 클릭 처리]
    function callPrev(type) {
      let curCalled = calledNumbers[type];
      if (curCalled > 0) {
        curCalled--;
        localStorage.setItem(CALL_KEYS[type], curCalled);
        calledNumbers[type] = curCalled;
        $(type === 'survival' ? 'svCalledNo' : 'vrCalledNo').textContent = pad(curCalled);
      }
    }
  </script>
</body>
</html>
