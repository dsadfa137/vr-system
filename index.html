<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>문경에코월드 통합 대기 전광판</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --survival-color: #9333ea;
      --vr-color: #06b6d4;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      padding: 12px;
      text-align: center;
      border-bottom: 3px solid #334155;
      position: relative;
    }
    .header h1 { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: 1px; }

    /* [우측 상단] 직원 전용 모드 토글 스위치 버튼 */
    .admin-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: #334155;
      color: #94a3b8;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .admin-toggle.active {
      background: #ef4444;
      color: #fff;
    }

    /* 메인 2분할 레이아웃 컨테이너 */
    .split-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      padding: 15px;
      gap: 15px;
      overflow: hidden;
    }

    .section-zone {
      flex: 1;
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .zone-title {
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      color: #fff;
    }
    .section-zone.survival { border: 3px solid var(--survival-color); }
    .section-zone.survival .zone-title { background: var(--survival-color); }
    .section-zone.vr { border: 3px solid var(--vr-color); }
    .section-zone.vr .zone-title { background: var(--vr-color); }

    /* 대형 호출 번호 박스 */
    .number-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .number-box .label { font-size: 16px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    .number-box .num { font-size: 90px; font-weight: 900; line-height: 1.1; }
    .section-zone.survival .num { color: #fff; text-shadow: 0 0 20px rgba(147,51,234,0.6); }
    .section-zone.vr .num { color: #fff; text-shadow: 0 0 20px rgba(6,182,212,0.6); }

    /* 예약 현황 요약 */
    .status-row {
      display: flex;
      gap: 10px;
    }
    .mini-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .mini-card p { font-size: 13px; color: var(--muted); font-weight: bold; margin-bottom: 4px; }
    .mini-card div { font-size: 28px; font-weight: 900; }

    /* 🕹️ 직원 전용 제어 스위치 영역 (기본 숨김 처리) */
    .control-row {
      display: none; /* 토글 켜기 전까지 완전 숨김 */
      grid-template-columns: 2fr 1fr;
      gap: 10px;
      animation: fadeIn 0.2s ease-in-out;
    }
    .btn {
      border: 0; border-radius: 12px; padding: 14px 5px; font-size: 15px; font-weight: 800; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center; transition: opacity 0.1s;
    }
    .btn:active { opacity: 0.8; }
    .survival .btn.next { background: var(--survival-color); }
    .vr .btn.next { background: var(--vr-color); }
    .btn.sub { background: #475569; font-size: 13px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 📱 모바일 세로 모드 대응 (짤림 현상 방지 완벽 최적화) */
    @media (max-width: 768px) {
      body { overflow-y: auto; } /* 모바일에서 내용이 많아질 경우 안전하게 스크롤 제공 */
      .split-container { 
        flex-direction: column; 
        padding: 10px; 
        gap: 10px; 
        overflow-y: visible;
        flex: none;
        height: auto;
      }
      .header h1 { font-size: 18px; }
      .admin-toggle { padding: 4px 8px; font-size: 11px; }
      .section-zone { padding: 15px; gap: 8px; flex: none; }
      .zone-title { font-size: 16px; padding: 6px; }
      .number-box { padding: 15px 10px; }
      .number-box .num { font-size: 60px; }
      .mini-card div { font-size: 22px; }
      .btn { padding: 16px 5px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>문경에코월드 실시간 입장 안내 시스템</h1>
    <button class="admin-toggle" id="adminToggle" onclick="toggleAdminMode()">⚙️ 직원 제어 열기</button>
  </header>

  <div class="split-container">
    
    <div class="section-zone survival">
      <div class="zone-title">💥 레이저 서바이벌</div>
      <div class="number-box">
        <div class="label">현재 호출 대기 번호</div>
        <div class="num" id="svCalledNo">000</div>
      </div>
      <div class="status-row">
        <div class="mini-card">
          <p>금일 총 예약 건수</p>
          <div id="svLastNo" style="color: var(--survival-color);">000</div>
        </div>
      </div>
      <div class="control-row admin-controls">
        <button class="btn next" onclick="callNext('survival')">▶ 다음 번호 호출 (+1)</button>
        <button class="btn sub" onclick="callPrev('survival')">◀ 후퇴</button>
      </div>
    </div>

    <div class="section-zone vr">
      <div class="zone-title">🤖 VR 체험존</div>
      <div class="number-box">
        <div class="label">현재 호출 대기 번호</div>
        <div class="num" id="vrCalledNo">000</div>
      </div>
      <div class="status-row">
        <div class="mini-card">
          <p>금일 총 예약 건수</p>
          <div id="vrLastNo" style="color: var(--vr-color);">000</div>
        </div>
      </div>
      <div class="control-row admin-controls">
        <button class="btn next" onclick="callNext('vr')">▶ 다음 번호 호출 (+1)</button>
        <button class="btn sub" onclick="callPrev('vr')">◀ 후퇴</button>
      </div>
    </div>

  </div>

  <script>
    const DB_KEYS = { survival: 'eco_srv_bookings', vr: 'eco_vr_bookings' };
    const CALL_KEYS = { survival: 'eco_survival_called_display', vr: 'eco_vr_called_display' };

    let totalCounts = { survival: 0, vr: 0 };
    let calledNumbers = { survival: 0, vr: 0 };

    const $ = id => document.getElementById(id);
    function pad(n){ return String(n).padStart(3, '0'); }

    // [핵심 추가] 직원 전용 스위치 제어 함수 (열고 닫기 토글)
    function toggleAdminMode() {
      const btn = $('adminToggle');
      const controls = document.querySelectorAll('.admin-controls');
      const isHidden = controls[0].style.display !== 'grid';

      controls.forEach(el => {
        el.style.display = isHidden ? 'grid' : 'none';
      });

      if(isHidden) {
        btn.textContent = '🔒 제어 스위치 숨기기';
        btn.classList.add('active');
      } else {
        btn.textContent = '⚙️ 직원 제어 열기';
        btn.classList.remove('active');
      }
    }

    window.onload = function() {
      if(!localStorage.getItem(CALL_KEYS.survival)) localStorage.setItem(CALL_KEYS.survival, 0);
      if(!localStorage.getItem(CALL_KEYS.vr)) localStorage.setItem(CALL_KEYS.vr, 0);

      loadAndSyncData();

      window.addEventListener('storage', (e) => {
        if (e.key === DB_KEYS.survival || e.key === DB_KEYS.vr) loadAndSyncData();
        if (e.key === CALL_KEYS.survival) {
          calledNumbers.survival = Number(e.newValue || 0);
          $('svCalledNo').textContent = pad(calledNumbers.survival);
        }
        if (e.key === CALL_KEYS.vr) {
          calledNumbers.vr = Number(e.newValue || 0);
          $('vrCalledNo').textContent = pad(calledNumbers.vr);
        }
      });

      setInterval(() => loadAndSyncData(), 800);
    };

    function loadAndSyncData() {
      try {
        totalCounts.survival = Object.keys(JSON.parse(localStorage.getItem(DB_KEYS.survival) || '{}')).length;
      } catch(e) { totalCounts.survival = 0; }

      try {
        totalCounts.vr = Object.keys(JSON.parse(localStorage.getItem(DB_KEYS.vr) || '{}')).length;
      } catch(e) { totalCounts.vr = 0; }

      calledNumbers.survival = Number(localStorage.getItem(CALL_KEYS.survival) || 0);
      calledNumbers.vr = Number(localStorage.getItem(CALL_KEYS.vr) || 0);

      $('svLastNo').textContent = pad(totalCounts.survival);
      $('svCalledNo').textContent = pad(calledNumbers.survival);
      $('vrLastNo').textContent = pad(totalCounts.vr);
      $('vrCalledNo').textContent = pad(calledNumbers.vr);
    }

    function playVoice(type, num) {
      if (num === 0) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}

      setTimeout(() => {
        const koName = (type === 'survival') ? '레이저 서바이벌' : '브이알 체험존';
        const msg = `${koName}, ${num}번 대기자님 입장해 주시기 바랍니다.`;
        const utterance = new SpeechSynthesisUtterance(msg);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }, 500);
    }

    function callNext(type) {
      loadAndSyncData();
      let curCalled = calledNumbers[type];
      let maxLimit = totalCounts[type];

      if (curCalled < maxLimit) {
        curCalled++;
        localStorage.setItem(CALL_KEYS[type], curCalled);
        calledNumbers[type] = curCalled;
        $(type === 'survival' ? 'svCalledNo' : 'vrCalledNo').textContent = pad(curCalled);
        playVoice(type, curCalled);
      } else {
        const koName = (type === 'survival') ? '레이저 서바이벌' : 'VR 체험존';
        alert(`${koName}에 오늘 접수된 예약 건수가 없거나 마지막 번호입니다.`);
      }
    }

    function callPrev(type) {
      let curCalled = calledNumbers[type];
      if (curCalled > 0) {
        curCalled--;
        localStorage.setItem(CALL_KEYS[type], curCalled);
        calledNumbers[type] = curCalled;
        $(type === 'survival' ? 'svCalledNo' : 'vrCalledNo').textContent = pad(curCalled);
      }
    }
  </script>
</body>
</html>
