<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>문경에코월드 실시간 입장 안내 전광판 (리모컨 내장)</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #1e293b;
      --survival-color: #a855f7;
      --vr-color: #06b6d4;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 20px;
    }

    /* 상단 헤더 */
    .header {
      text-align: center;
      padding: 10px 0 20px 0;
      position: relative;
    }
    .header h1 {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }
    
    /* 리모컨 토글 버튼 (우측 상단 고정) */
    .admin-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #334155;
      color: #f1f5f9;
      border: 1px solid #475569;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 100;
    }
    .admin-toggle-btn.active {
      background: var(--danger);
      border-color: var(--danger);
    }

    /* 대형 2분할 레이아웃 */
    .split-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 25px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .section-zone {
      flex: 1;
      background: var(--card);
      border-radius: 32px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .section-zone.survival { border: 4px solid var(--survival-color); }
    .section-zone.vr { border: 4px solid var(--vr-color); }

    .zone-title {
      font-size: 32px;
      font-weight: 900;
      text-align: center;
      padding: 15px;
      border-radius: 20px;
      color: #fff;
    }
    .section-zone.survival .zone-title { background: linear-gradient(135deg, var(--survival-color), #7c3aed); }
    .section-zone.vr .zone-title { background: linear-gradient(135deg, var(--vr-color), #0891b2); }

    /* 대형 번호 표시 박스 */
    .number-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid #334155;
    }
    .number-box .label { 
      font-size: 22px; 
      font-weight: 700; 
      color: var(--muted); 
      margin-bottom: 10px; 
    }
    .number-box .num { 
      font-size: 160px; 
      font-weight: 900; 
      line-height: 1; 
    }
    .section-zone.survival .num { color: #ffffff; text-shadow: 0 0 40px rgba(168,85,247,0.8); }
    .section-zone.vr .num { color: #ffffff; text-shadow: 0 0 40px rgba(6,182,212,0.8); }

    .status-row { 
      display: flex; 
      background: rgba(15, 23, 42, 0.4);
      border-radius: 16px;
      padding: 12px;
      justify-content: center;
      align-items: center;
      border: 1px solid #334155;
    }
    .status-row p { font-size: 16px; color: var(--muted); font-weight: bold; margin-right: 15px; }
    .status-row div { font-size: 22px; font-weight: 900; }

    /* 슬라이딩 하단 모바일 리모컨 패널 영역 */
    .remote-panel {
      background: #1e293b;
      border-top: 4px solid #475569;
      margin: 0 -20px -20px -20px;
      padding: 20px 40px;
      display: none; /* 기본 숨김 */
      animation: slideUp 0.3s ease-out;
    }
    
    .remote-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .remote-zone-control {
      background: rgba(15, 23, 42, 0.5);
      padding: 15px;
      border-radius: 20px;
      border: 1px solid #334155;
    }
    .remote-zone-control h4 {
      font-size: 16px;
      margin-bottom: 12px;
      text-align: center;
      font-weight: 800;
    }
    
    /* 제어 버튼 그룹 */
    .btn-group {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn {
      border: 0; border-radius: 12px; padding: 15px 5px; font-size: 16px; font-weight: 800; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center; transition: opacity 0.1s;
    }
    .btn:active { opacity: 0.8; }
    .survival .btn.next { background: var(--survival-color); }
    .vr .btn.next { background: var(--vr-color); }
    .btn.prev { background: #475569; }
    
    /* 초기화 버튼 공통 스타일 */
    .btn.reset {
      width: 100%;
      background: #334155;
      font-size: 13px;
      padding: 8px;
      border: 1px solid #475569;
      color: #cbd5e1;
    }
    .btn.reset:hover {
      background: var(--danger);
      color: #fff;
    }

    /* 오디오 활성화 안내 알림 */
    #audioNotice {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--danger);
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 15px;
      z-index: 1000;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* 모바일 기기(모바일 리모컨용) 대응 레이아웃 정의 */
    @media (max-width: 768px) {
      body { overflow-y: auto; height: auto; }
      .split-container { flex-direction: column; height: auto; overflow: visible; }
      .header h1 { font-size: 24px; }
      .admin-toggle-btn { padding: 6px 12px; font-size: 12px; }
      .number-box .num { font-size: 100px; }
      .remote-panel { padding: 20px 15px; }
      .remote-grid { grid-template-columns: 1fr; gap: 15px; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div id="audioNotice" onclick="enableAudio()">
    🔊 음성 방송 연동을 위해 화면을 한 번 터치(클릭)해 주세요.
  </div>

  <header class="header">
    <h1>문경에코월드 실시간 입장 안내 시스템</h1>
    <button class="admin-toggle-btn" id="adminToggle" onclick="toggleRemotePanel()">⚙️ 리모컨 패널 열기</button>
  </header>

  <div class="split-container">
    <div class="section-zone survival">
      <div class="zone-title">💥 레이저 서바이벌</div>
      <div class="number-box">
        <div class="label">현재 호출 대기 번호</div>
        <div class="num" id="svCalledNo">000</div>
      </div>
      <div class="status-row">
        <p>금일 총 예약 건수 :</p>
        <div id="svLastNo" style="color: var(--survival-color);">000</div>
      </div>
    </div>

    <div class="section-zone vr">
      <div class="zone-title">🤖 VR 체험존</div>
      <div class="number-box">
        <div class="label">현재 호출 대기 번호</div>
        <div class="num" id="vrCalledNo">000</div>
      </div>
      <div class="status-row">
        <p>금일 총 예약 건수 :</p>
        <div id="vrLastNo" style="color: var(--vr-color);">000</div>
      </div>
    </div>
  </div>

  <footer class="remote-panel" id="remotePanel">
    <div class="remote-grid">
      <div class="remote-zone-control survival">
        <h4>💥 레이저 서바이벌 리모컨</h4>
        <div class="btn-group">
          <button class="btn next" onclick="callNext('survival')">▶ 다음 호출 (+1)</button>
          <button class="btn prev" onclick="callPrev('survival')">◀ 후퇴</button>
        </div>
        <button class="btn reset" onclick="resetDayData('survival')">⚠️ 서바이벌 당일 예약 데이터 초기화</button>
      </div>

      <div class="remote-zone-control vr">
        <h4>🤖 VR 체험존 리모컨</h4>
        <div class="btn-group">
          <button class="btn next" onclick="callNext('vr')">▶ 다음 호출 (+1)</button>
          <button class="btn prev" onclick="callPrev('vr')">◀ 후퇴</button>
        </div>
        <button class="btn reset" onclick="resetDayData('vr')">⚠️ VR 체험존 당일 예약 데이터 초기화</button>
      </div>
    </div>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDeKWmVbxfvO9SKjJXYCkuJrz630u6pxsk",
      authDomain: "mungyeong-kiosk.firebaseapp.com",
      databaseURL: "https://mungyeong-kiosk-default-rtdb.firebaseio.com/",
      projectId: "mungyeong-kiosk",
      storageBucket: "mungyeong-kiosk.appspot.com",
      messagingSenderId: "1020366726033",
      appId: "1:1020366726033:web:04fc7e0638d1d0e40c3030",
      measurementId: "G-8GSFNWLX5Q"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const DB_KEYS = { survival: 'eco_srv_bookings', vr: 'eco_vr_bookings' };
    const CALL_KEYS = { survival: 'eco_survival_called_display', vr: 'eco_vr_called_display' };

    let totalCounts = { survival: 0, vr: 0 };
    let calledNumbers = { survival: 0, vr: 0 };
    let isInitialLoad = { survival: true, vr: true };
    let audioCtx = null;

    const $ = id => document.getElementById(id);
    function pad(n){ return String(n).padStart(3, '0'); }

    function enableAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if ($('audioNotice')) $('audioNotice').style.display = 'none';
    }
    window.addEventListener('click', enableAudio);

    // 하단 모바일 리모컨 패널 슬라이딩 토글 제어 함수
    function toggleRemotePanel() {
      enableAudio();
      const panel = $('remotePanel');
      const btn = $('adminToggle');
      const isHidden = panel.style.display !== 'block';
      
      if(isHidden) {
        panel.style.display = 'block';
        btn.textContent = '🔒 리모컨 패널 숨기기';
        btn.classList.add('active');
        // 스크롤을 하단 리모컨으로 자연스럽게 이동 (모바일 배려)
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      } else {
        panel.style.display = 'none';
        btn.textContent = '⚙️ 리모컨 패널 열기';
        btn.classList.remove('active');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      // 실시간 데이터 바인딩 로직
      database.ref(DB_KEYS.survival).on('value', (snapshot) => {
        const data = snapshot.val() || {};
        totalCounts.survival = Object.keys(data).length;
        $('svLastNo').textContent = pad(totalCounts.survival);
      });

      database.ref(DB_KEYS.vr).on('value', (snapshot) => {
        const data = snapshot.val() || {};
        totalCounts.vr = Object.keys(data).length;
        $('vrLastNo').textContent = pad(totalCounts.vr);
      });

      database.ref(CALL_KEYS.survival).on('value', (snapshot) => {
        const prevNum = calledNumbers.survival;
        calledNumbers.survival = Number(snapshot.val() || 0);
        $('svCalledNo').textContent = pad(calledNumbers.survival);
        if (!isInitialLoad.survival && calledNumbers.survival > prevNum) {
          playVoice('survival', calledNumbers.survival);
        }
        isInitialLoad.survival = false;
      });

      database.ref(CALL_KEYS.vr).on('value', (snapshot) => {
        const prevNum = calledNumbers.vr;
        calledNumbers.vr = Number(snapshot.val() || 0);
        $('vrCalledNo').textContent = pad(calledNumbers.vr);
        if (!isInitialLoad.vr && calledNumbers.vr > prevNum) {
          playVoice('vr', calledNumbers.vr);
        }
        isInitialLoad.vr = false;
      });
    });

    // 음성 방송 로직
    function playVoice(type, num) {
      if (num === 0) return;
      try {
        if (audioCtx && audioCtx.state === 'running') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }
      } catch(e) {}

      setTimeout(() => {
        const koName = (type === 'survival') ? '레이저 서바이벌' : '브이알 체험존';
        const msg = `${koName}, ${num}번 대기자님 입장해 주시기 바랍니다.`;
        const utterance = new SpeechSynthesisUtterance(msg);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }, 500);
    }

    // 다음 대기자 호출 함수
    function callNext(type) {
      let curCalled = calledNumbers[type];
      let maxLimit = totalCounts[type];
      if (curCalled < maxLimit) {
        curCalled++;
        database.ref(CALL_KEYS[type]).set(curCalled);
      } else {
        const koName = (type === 'survival') ? '레이저 서바이벌' : 'VR 체험존';
        alert(`${koName}에 오늘 발행된 키오스크 발권 내역이 더 이상 없거나 마지막 예약자입니다.`);
      }
    }

    // 호출 번호 감산(후퇴) 함수
    function callPrev(type) {
      let curCalled = calledNumbers[type];
      if (curCalled > 0) {
        curCalled--;
        database.ref(CALL_KEYS[type]).set(curCalled);
      }
    }

    // 💥 [핵심 추가] 당일 데이터 완전 초기화 기능 (키오스크 리셋 연동)
    function resetDayData(type) {
      const koName = (type === 'survival') ? '레이저 서바이벌' : 'VR 체험존';
      
      // 관리자 오작동 방지용 이중 안전 확인창
      if (confirm(`실제 마감 시간에만 사용하세요!\n\n오늘 누적된 [${koName}]의 모든 예약 건수와 호출 번호를 전체 초기화(000) 하시겠습니까?`)) {
        if (confirm("정말로 초기화합니까? 이 작업은 파이어베이스 서버에서 데이터를 즉시 영구 삭제하므로 되돌릴 수 없습니다.")) {
          
          // 1. 해당 구역의 키오스크 예약 리스트 내역 완전 삭제
          database.ref(DB_KEYS[type]).remove()
            .then(() => {
              // 2. 현재 대기판 호출 번호도 0으로 마이그레이션 리셋
              return database.ref(CALL_KEYS[type]).set(0);
            })
            .then(() => {
              alert(`${koName}의 당일 데이터가 성공적으로 클리어되었습니다.`);
            })
            .catch((err) => {
              alert("초기화 처리 중 네트워크 에러가 발생했습니다: " + err.message);
            });
        }
      }
    }
  </script>
</body>
</html>
