<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>문경에코월드 통합 대기 전광판</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --survival-color: #9333ea; /* 키오스크와 동일한 서바이벌 보라색 */
      --vr-color: #06b6d4;       /* 키오스크와 동일한 VR 하늘색 */
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid #334155;
    }
    .header h1 { font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 1px; }

    /* 좌우 2분할 메인 컨테이너 */
    .split-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      padding: 15px;
      gap: 15px;
      overflow: hidden;
    }

    /* 구역 공통 스타일 */
    .section-zone {
      flex: 1;
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    .zone-title {
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      color: #fff;
    }
    .section-zone.survival { border: 3px solid var(--survival-color); }
    .section-zone.survival .zone-title { background: var(--survival-color); }
    .section-zone.vr { border: 3px solid var(--vr-color); }
    .section-zone.vr .zone-title { background: var(--vr-color); }

    /* 대형 호출 번호 박스 */
    .number-box {
      flex: 1.5;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .number-box .label { font-size: 18px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    
    /* 멀리서도 잘 보이도록 번호 크기 소폭 상향 조정 */
    .number-box .num { font-size: 100px; font-weight: 900; line-height: 1.1; }
    
    /* 실시간 호출 시 화려한 네온 효과 */
    .section-zone.survival .num { color: #fff; text-shadow: 0 0 25px rgba(147,51,234,0.7); }
    .section-zone.vr .num { color: #fff; text-shadow: 0 0 25px rgba(6,182,212,0.7); }

    /* 현황판 요약 (예약 현황) */
    .status-row {
      display: flex;
      gap: 12px;
    }
    .mini-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .mini-card p { font-size: 14px; color: var(--muted); font-weight: bold; margin-bottom: 6px; }
    .mini-card div { font-size: 32px; font-weight: 900; }

    /* 직원용 제어 리모컨 버튼 영역 (완벽 복구) */
    .control-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }
    .btn {
      border: 0; border-radius: 12px; padding: 18px 5px; font-size: 16px; font-weight: 800; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center; transition: background 0.1s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .btn:active { opacity: 0.8; transform: scale(0.98); }
    .survival .btn.next { background: var(--survival-color); }
    .vr .btn.next { background: var(--vr-color); }
    .btn.sub { background: #475569; font-size: 14px; }

    /* 모바일 세로 모드 및 스마트폰 제어 화면 최적화 */
    @media (max-width: 768px) {
      .split-container { flex-direction: column; padding: 10px; gap: 10px; }
      body { overflow-y: auto; } /* 모바일에서 버튼이 잘리지 않도록 스크롤 허용 */
      .header h1 { font-size: 20px; }
      .zone-title { font-size: 18px; padding: 8px; }
      .number-box .num { font-size: 70px; }
      .mini-card div { font-size: 24px; }
      .btn { padding: 20px 5px; font-size: 16px; } /* 모바일에서 터치하기 쉽도록 버튼 크기 유지 */
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>문경에코월드 실시간 입장 안내 시스템</h1>
  </header>

  <div class="split-container">
    
    <div class="section-zone survival" id="zoneSurvival">
      <div class="zone-title">💥 레이저 서바이벌</div>
      <div class="number-box">
        <div class="label">현재 호출 대기 번호</div>
        <div class="num" id="svCalledNo">000</div>
      </div>
      <div class="status-row">
        <div class="mini-card" style="flex:1;">
          <p>금일 총 예약 건수</p>
          <div id="svLastNo" style="color: var(--survival-color);">000</div>
        </div>
      </div>
      <div class="control-row">
        <button class="btn next" onclick="callNext('survival')">▶ 다음 번호 호출 (+1)</button>
        <button class="btn sub" onclick="callPrev('survival')">◀ 후퇴</button>
      </div>
    </div>

    <div class="section-zone vr" id="zoneVr">
      <div class="zone-title">🤖 VR 체험존</div>
      <div class="number-box">
        <div class="label">현재 호출 대기 번호</div>
        <div class="num" id="vrCalledNo">000</div>
      </div>
      <div class="status-row">
        <div class="mini-card" style="flex:1;">
          <p>금일 총 예약 건수</p>
          <div id="vrLastNo" style="color: var(--vr-color);">000</div>
        </div>
      </div>
      <div class="control-row">
        <button class="btn next" onclick="callNext('vr')">▶ 다음 번호 호출 (+1)</button>
        <button class="btn sub" onclick="callPrev('vr')">◀ 후퇴</button>
      </div>
    </div>

  </div>

  <script>
    // 키오스크 실제 데이터베이스 Key 명칭과 연동 매핑
    const DB_KEYS = {
      survival: 'eco_srv_bookings', 
      vr: 'eco_vr_bookings'         
    };

    // 직원용 호출 상태 관리 Key 명칭
    const CALL_KEYS = {
      survival: 'eco_survival_called_display',
      vr: 'eco_vr_called_display'
    };

    let totalCounts = { survival: 0, vr: 0 };
    let calledNumbers = { survival: 0, vr: 0 };

    const $ = id => document.getElementById(id);
    function pad(n){ return String(n).padStart(3, '0'); }

    window.onload = function() {
      // 초기 호출 데이터 셋팅
      if(!localStorage.getItem(CALL_KEYS.survival)) localStorage.setItem(CALL_KEYS.survival, 0);
      if(!localStorage.getItem(CALL_KEYS.vr)) localStorage.setItem(CALL_KEYS.vr, 0);

      loadAndSyncData();

      /* [실시간 100% 상호 연동 리스너]
        - 모바일(스마트폰)에서 버튼을 누르면 -> TV 전광판이 새창고침 없이 실시간 변동 및 TTS 방송
        - TV 전광판 PC에서 버튼을 누르면 -> 모바일 화면의 번호도 즉시 실시간 일치 동기화
      */
      window.addEventListener('storage', (e) => {
        if (e.key === DB_KEYS.survival || e.key === DB_KEYS.vr) {
          loadAndSyncData();
        }
        
        if (e.key === CALL_KEYS.survival) {
          const newNum = Number(e.newValue || 0);
          if(calledNumbers.survival !== newNum) {
            calledNumbers.survival = newNum;
            $('svCalledNo').textContent = pad(newNum);
            triggerHighlight('zoneSurvival');
            playVoice('survival', newNum);
          }
        }
        
        if (e.key === CALL_KEYS.vr) {
          const newNum = Number(e.newValue || 0);
          if(calledNumbers.vr !== newNum) {
            calledNumbers.vr = newNum;
            $('vrCalledNo').textContent = pad(newNum);
            triggerHighlight('zoneVr');
            playVoice('vr', newNum);
          }
        }
      });

      // 0.8초 주기 초고속 상시 백업 동기화
      setInterval(() => syncNumbersOnly(), 800);
    };

    // 데이터 로드 및 UI 반영
    function loadAndSyncData() {
      try {
        const srvObj = JSON.parse(localStorage.getItem(DB_KEYS.survival) || '{}');
        totalCounts.survival = Object.keys(srvObj).length;
      } catch(e) { totalCounts.survival = 0; }

      try {
        const vrObj = JSON.parse(localStorage.getItem(DB_KEYS.vr) || '{}');
        totalCounts.vr = Object.keys(vrObj).length;
      } catch(e) { totalCounts.vr = 0; }

      calledNumbers.survival = Number(localStorage.getItem(CALL_KEYS.survival) || 0);
      calledNumbers.vr = Number(localStorage.getItem(CALL_KEYS.vr) || 0);

      $('svLastNo').textContent = pad(totalCounts.survival);
      $('svCalledNo').textContent = pad(calledNumbers.survival);
      $('vrLastNo').textContent = pad(totalCounts.vr);
      $('vrCalledNo').textContent = pad(calledNumbers.vr);
    }

    // 타이머용 무음성 단순 번호 동기화 (기기 간 일치화 보장)
    function syncNumbersOnly() {
      const sNum = Number(localStorage.getItem(CALL_KEYS.survival) || 0);
      const vNum = Number(localStorage.getItem(CALL_KEYS.vr) || 0);
      
      if(calledNumbers.survival !== sNum) {
        calledNumbers.survival = sNum;
        $('svCalledNo').textContent = pad(sNum);
      }
      if(calledNumbers.vr !== vNum) {
        calledNumbers.vr = vNum;
        $('vrCalledNo').textContent = pad(vNum);
      }
    }

    // 호출 시 구역 깜빡임 이펙트
    function triggerHighlight(zoneId) {
      const target = $(zoneId);
      target.style.transform = "scale(1.01)";
      setTimeout(() => target.style.transform = "scale(1)", 300);
    }

    // 웰컴 알림음 + 한국어 고품질 TTS 안내방송
    function playVoice(type, num) {
      if (num === 0) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}

      setTimeout(() => {
        const koName = (type === 'survival') ? '레이저 서바이벌' : '브이알 체험존';
        const msg = `${koName}, ${num}번 대기자님 입장해 주시기 바랍니다.`;
        const utterance = new SpeechSynthesisUtterance(msg);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }, 400);
    }

    // [다음 호출 버튼] - 직접 클릭 시 작동 및 스토리지 업데이트
    function callNext(type) {
      loadAndSyncData();
      let curCalled = calledNumbers[type];
      let maxLimit = totalCounts[type];

      if (curCalled < maxLimit) {
        curCalled++;
        localStorage.setItem(CALL_KEYS[type], curCalled);
        calledNumbers[type] = curCalled;
        $(type === 'survival' ? 'svCalledNo' : 'vrCalledNo').textContent = pad(curCalled);
        triggerHighlight(type === 'survival' ? 'zoneSurvival' : 'zoneVr');
        playVoice(type, curCalled);
      } else {
        const koName = (type === 'survival') ? '레이저 서바이벌' : 'VR 체험존';
        alert(`${koName}의 예약이 없거나 마지막 번호입니다.`);
      }
    }

    // [후퇴 버튼]
    function callPrev(type) {
      let curCalled = calledNumbers[type];
      if (curCalled > 0) {
        curCalled--;
        localStorage.setItem(CALL_KEYS[type], curCalled);
        calledNumbers[type] = curCalled;
        $(type === 'survival' ? 'svCalledNo' : 'vrCalledNo').textContent = pad(curCalled);
      }
    }
  </
