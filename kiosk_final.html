<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>문경에코월드 통합 예약 발권 시스템</title>
  <style>
    :root{
      --bg:#f0f4f9;
      --card:#ffffff;
      --ink:#1e293b;
      --muted:#64748b;
      --line:#e2e8f0;
      --primary:#1266f1;
      --survival:#9333ea;
      --vr:#06b6d4;
      --dark:#0f172a;
      --danger:#ef4444;
      --ok:#22c55e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Pretendard','Noto Sans KR',sans-serif;
      background:var(--bg);
      color:var(--ink);
      user-select: none;
      overflow:hidden;
    }

    .wrap{
      width:100vw;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:10px;
    }
    .screen{
      width:min(100%,720px);
      height:min(100%,1280px);
      background:var(--card);
      border-radius:24px;
      box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);
      padding:24px;
      display:flex;
      flex-direction:column;
      position:relative;
      overflow:hidden;
    }

    .header{
      text-align:center;
      border-bottom:2px solid var(--line);
      padding-bottom:12px;
      margin-bottom:16px;
    }
    .header h1{ margin:0; font-size:32px; font-weight:900; color:var(--dark); }
    .header .time-box{ margin-top:6px; font-size:16px; color:var(--muted); font-weight:bold;}

    .content-page{
      display:none;
      flex-direction:column;
      flex:1;
      overflow-y:auto;
      padding-bottom:10px;
    }
    .content-page.active{ display:flex; }

    .zone-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .zone-card {
      border: 2px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .zone-img {
      width: 100%;
      height: 140px;
      background-size: cover;
      background-position: center;
      background-color: #ddd;
    }
    .zone-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .zone-title { font-size: 22px; font-weight: 800; margin: 0 0 8px 0; text-align: center;}
    .zone-card.survival .zone-title { color: var(--survival); }
    .zone-card.vr .zone-title { color: var(--vr); }
    .zone-desc { font-size: 14px; color: var(--muted); line-height: 1.4; margin: 0 0 12px 0; flex: 1; text-align: justify;}
    .zone-condition { 
      background: #fff1f2; color: var(--danger); 
      padding: 8px; border-radius: 8px; 
      font-size: 15px; font-weight: 700; text-align: center;
    }
    
    .main-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .btn-action {
      border: 0; border-radius: 18px; color: white;
      font-size: 24px; font-weight: 900; padding: 24px 10px;
      cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      transition: transform 0.1s;
    }
    .btn-action:active { transform: scale(0.97); }
    .btn-action.btn-survival { background: linear-gradient(135deg, #a855f7, var(--survival)); }
    .btn-action.btn-vr { background: linear-gradient(135deg, #06b6d4, #0891b2); }

    .status-board {
      border: 2px solid var(--line);
      border-radius: 18px; padding: 16px;
      background: #f8fafc;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      text-align: center;
      margin-bottom: 20px;
    }
    .status-box h3 { margin: 0 0 6px 0; font-size: 16px; color: var(--muted); }
    .status-box .num { font-size: 44px; font-weight: 900; }
    .status-box.srv .num { color: var(--survival); }
    .status-box.vrc .num { color: var(--vr); }

      width: 100
