<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VR 체험존 순번 대기 전광판 및 리모컨</title>
  <style>
    :root {
      --bg: #0f172a; 
      --card: #1e293b;
      --primary: #06b6d4; 
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 상단 타이틀 구조 */
    .header {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      padding: 20px;
      text-align: center;
      border-bottom: 4px solid var(--primary);
    }
    .header h1 { font-size: 38px; font-weight: 900; color: var(--primary); letter-spacing: 2px; }

    /* 메인 전광판 영역 (TV 화면용) */
    .display-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      padding: 30px;
      gap: 30px;
    }

    /* 현재 호출 번호 */
    .main-call-box {
      flex: 2;
      background: var(--card);
      border-radius: 24px;
      border: 2px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      padding: 20px;
    }
    .main-call-box .title { font-size: 40px; font-weight: 800; color: var(--muted); margin-bottom: 10px; }
    .main-call-box .number { font-size: 180px; font-weight: 900; color: #fff; text-shadow: 0 0 30px rgba(6,182,212,0.6); line-height: 1.1; }
    .main-call-box .status-text { font-size: 24px; font-weight: bold; color: var(--accent); background: rgba(16,185,129,0.1); padding: 10px 24px; border-radius: 50px; text-align: center; }

    /* 서브 현황 */
    .side-status-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .status-card {
      flex: 1;
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px solid #334155;
    }
    .status-card h3 { font-size: 24px; color: var(--muted); margin-bottom: 15px; }
    .status-card .val { font-size: 70px; font-weight: 900; color: var(--primary); }

    /* 하단 직원용 리모컨 패널 */
    .remote-panel {
      background: #1e293b;
      border-top: 4px solid #475569;
      padding: 20px;
    }
    .remote-title { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .btn-toggle-remote { background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
    
    .remote-controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
    }
    .btn-remote {
      border: 0; border-radius: 14px; padding: 18px; font-size: 20px; font-weight: 800; cursor: pointer; color: #fff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-remote:active { transform: scale(0.97); }
    .btn-remote.next { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .btn-remote.prev { background: #475569; }
    .btn-remote.recall { background: #10b981; }

    /* 📱 모바일 환경 (스마트폰 크기) 최적화 미디어 쿼리 */
    @media (max-width: 768px) {
      body { overflow-y: auto; padding: 10px; }
      .header { padding: 12px; margin-bottom: 10px; }
      .header h1 { font-size: 22px; }
      
      .display-container { flex-direction: column; padding: 5px; gap: 12px; }
      .main-call-box { padding: 20px 10px; border-radius: 16px; }
      .main-call-box .title { font-size: 18px; }
      .main-call-box .number { font-size: 90px; margin: 5px 0; }
      .main-call-box .status-text { font-size: 15px; padding: 6px 16px; }

      .side-status-box { flex-direction: grid; grid-template-columns: 1fr 1fr; display: grid; gap: 10px; }
      .status-card { padding: 12px; border-radius: 14px; }
      .status-card h3 { font-size: 14px; margin-bottom: 4px; }
      .status-card .val { font-size: 32px; }

      .remote-panel { border-radius: 16px; margin-top: 10px; padding: 14px; border-top: 0; border: 2px solid #475569; }
      .remote-title { font-size: 14px; margin-bottom: 10px; }
      .remote-title .btn-toggle-remote { display: none; } /* 모바일에선 상시 노출 */
      
      .remote-controls { grid-template-columns: 1fr; gap: 10px; }
      .btn-remote { padding: 16px; font-size: 18px; border-radius: 12px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>VR 체험존 실시간 입장 순서 안내</h1>
  </header>

  <div class="display-container">
    <div class="main-call-box">
      <div class="title">지 금  입 장 하 실  번 호</div>
      <div class="number" id="tvCalledNo">000</div>
      <div class="status-text" id="tvStatusMsg">🔔 지정 스피커 볼륨을 높여주세요</div>
    </div>

    <div class="side-status-box">
      <div class="status-card">
        <h3>오늘 발권된 총 번호</h3>
        <div class="val" id="tvLastNo">000</div>
      </div>
      <div class="status-card">
        <h3>현재 대기 중인 인원</h3>
        <div class="val" id="tvWaitCount" style="color: #f59e0b;">0 명</div>
      </div>
    </div>
  </div>

  <div class="remote-panel" id="remoteControllerBox">
    <div class="remote-title">
      <span>🕹️ 직원 전용 스마트 무선 리모컨 컨트롤러</span>
      <button class="btn-toggle-remote" onclick="toggleTvMode()">🖥️ TV 모드 전환 (컨트롤러 숨기기/열기)</button>
    </div>
    <div class="remote-controls">
      <button class="btn-remote next" onclick="callNextNumber()">▶ 다음 고객 호출 (번호 +1 및 딩동음)</button>
      <button class="btn-remote recall" onclick="reVoiceSignal()">🔄 재호출 (음성 재송출)</button>
      <button class="btn-remote prev" onclick="callPrevNumber()">◀ 이전 번호로 후퇴</button>
    </div>
  </div>

  <script>
    let lastNo = 0;
    let calledNo = 0;

    const $ = id => document.getElementById(id);
    function pad(n){ return String(n).padStart(3, '0'); }

    window.onload = function() {
      syncData();
      window.addEventListener('storage', (e) => {
        if(e.key === 'eco_vr_last' || e.key === 'eco_vr_called') {
          syncData(true);
        }
      });
      setInterval(() => syncData(false), 1000);
    };

    function syncData(triggerVoice = false) {
      const currentLast = Number(localStorage.getItem('eco_vr_last') || 0);
      const currentCalled = Number(localStorage.getItem('eco_vr_called') || 0);

      if (currentCalled !== calledNo && calledNo !== 0 && triggerVoice) {
        calledNo = currentCalled;
        lastNo = currentLast;
        updateDom();
        playVoiceAlert();
      } else {
        lastNo = currentLast;
        calledNo = currentCalled;
        updateDom();
      }
    }

    function updateDom() {
      $('tvLastNo').textContent = pad(lastNo);
      $('tvCalledNo').textContent = pad(calledNo);
      
      let waitCount = lastNo - calledNo;
      if (waitCount < 0) waitCount = 0;
      $('tvWaitCount').textContent = waitCount + " 명";

      if(calledNo === 0) {
        $('tvStatusMsg').textContent = "대기 시 발권기에서 번호표를 뽑아주세요";
      } else {
        $('tvStatusMsg').textContent = "📢 차례가 되신 분은 내부로 입장해 주세요";
      }
    }

    function playVoiceAlert() {
      if (calledNo === 0) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15);
        
        setTimeout(() => {
          const osc2 = audioCtx.createOscillator();
          osc2.connect(gainNode);
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime); 
          osc2.start();
          osc2.stop(audioCtx.currentTime + 0.3);
        }, 150);
      } catch(e) { console.log("AudioContext 차단 우회"); }

      setTimeout(() => {
        const msgText = `브이알 체험, ${calledNo}번 대기자님 입장해 주시기 바랍니다.`;
        const utterance = new SpeechSynthesisUtterance(msgText);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95; 
        window.speechSynthesis.speak(utterance);
      }, 600);
    }

    function callNextNumber() {
      if (calledNo < lastNo) {
        calledNo++;
        localStorage.setItem('eco_vr_called', calledNo);
        updateDom();
        playVoiceAlert();
      } else {
        alert("현재 발권된 대기 번호표가 없거나 마지막 번호입니다.");
      }
    }

    function callPrevNumber() {
      if (calledNo > 0) {
        calledNo--;
        localStorage.setItem('eco_vr_called', calledNo);
        updateDom();
      }
    }

    function reVoiceSignal() {
      playVoiceAlert();
    }

    function toggleTvMode() {
      const panel = $('remoteControllerBox');
      panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
    }
  </script>
</body>
</html>
